<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Solo Engine</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span id="round" class="round"></span>
        <div class="topbar-actions">
          <button id="undo" type="button" class="icon-button" disabled>Undo</button>
          <button id="menu" type="button" class="icon-button">Menu</button>
        </div>
      </header>
      <p id="notice" class="notice" role="status" hidden></p>
      <main class="table">
        <section id="map" class="map" aria-label="Board"></section>
        <section class="side">
          <nav id="tabs" class="tabs" aria-label="Panels"></nav>
          <div id="panels" class="panels"></div>
        </section>
      </main>
      <footer id="decision" class="decision" aria-label="Your move"></footer>
    </div>
    <aside id="log-drawer" class="log-drawer" aria-label="Log">
      <button
        id="log-tag"
        type="button"
        class="log-tag"
        aria-expanded="false"
        aria-controls="log-body"
      >
        Log
      </button>
      <div id="log-body" class="log-drawer-body" inert></div>
    </aside>
    <dialog id="sheet" class="sheet"></dialog>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
